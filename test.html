<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="testerModal" class="active">
        <div id="testerLogin" style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; background: #141821; color: #fff;">
            <div style="background: #1C212C; padding: 40px; border-radius: 8px; border: 1px solid #2A303C;">
                <h3>Haven Portal Test</h3><br>
                <input type="email" id="testerEmail" placeholder="Email" style="padding: 10px; margin-bottom: 10px; width: 100%; box-sizing: border-box;"><br>
                <input type="password" id="testerPass" placeholder="Password" style="padding: 10px; margin-bottom: 10px; width: 100%; box-sizing: border-box;"><br>
                <button id="testerLoginBtn" style="padding: 10px; width: 100%; background: #3DDDC8; color: #000; border: none; border-radius: 4px; cursor: pointer;">Log In</button>
                <div id="testerError" style="color: #EF4444; margin-top: 10px;"></div>
            </div>
        </div>
        <div id="testerMenu" style="display: none; padding: 40px; background: #141821; color: #fff; height: 100vh;">
            <h1>Success! You are logged in.</h1>
            <button id="testerLogoutBtn" style="background: #EF4444; color: #fff; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">Log Out</button>
        </div>
    </div>
    <div id="toast-container"></div>
    
    <!-- Load the app.js file -->
    <script src="app.js?v=11"></script>
    
    <!-- Minimal inline script just for toasts -->
    <script>
        function showToast(msg) {
            let container = document.getElementById('toast-container');
            const toast = document.createElement('div'); toast.className = 'toast'; toast.textContent = msg; container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3500);
        }
    </script>
</body>
</html>
